# ==============================================================================
# AMBIENTE DE TESTE ISOLADO PARA O MESSAGING-SERVICE
# ==============================================================================
# IMPORTANTE: Este compose.yaml serve apenas para testes locais isolados deste 
# microserviço, provisionando um MongoDB local, Kafka e Zookeeper do zero.
#
# Para subir o ecossistema COMPLETO da aplicação (Auth + Messaging) conectado ao
# MongoDB Atlas (produção/nuvem via .env), utilize o compose.yaml que fica na raiz 
# principal do projeto.
# ==============================================================================
services:
  mongodb:
    image: 'mongo:latest'
    container_name: wtcmessenger-mongo
    environment:
      - 'MONGO_INITDB_DATABASE=${MONGO_DATABASE}'
      - 'MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}'
      - 'MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}'
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: wtcmessenger-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: wtcmessenger-kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mongodb_data:
