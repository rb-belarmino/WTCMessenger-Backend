spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:wtc-secret-key-change-in-production}
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000